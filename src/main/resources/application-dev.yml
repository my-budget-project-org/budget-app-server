# --- 'dev' 프로필 (로컬 개발용) ---
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/budget_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true